name: collect

# Verify before relying on this (CLAIMS G2): scheduled workflows in public repos are
# disabled after a period of repository inactivity. Whether the workflow's own commits
# reset that clock is UNCHECKED. If they do not, add a heartbeat.
on:
  schedule:
    - cron: "0 19 * * *"   # ~05:00 AEST. GitHub cron is best-effort, not punctual.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Never fails the job on a connector failure. A failed connector writes an
      # observation with availability_status = error and the run continues. Losing a
      # whole day because one provider changed its markup is the failure mode to avoid.
      - name: Collect
        run: python -m collect.run --all
        continue-on-error: true

      - name: Validate
        run: python -m normalise.validate --strict

      - name: Commit
        run: |
          git config user.name  "pro-collector"
          git config user.email "noreply@devpolicy.org"
          git add archive/ store/
          git diff --staged --quiet || git commit -m "collect: $(date -u +%Y-%m-%d)"
          git push

      # Any connector that errored opens or updates an issue, which is the input to the
      # repair loop in CLAUDE.md section 4.1.
      - name: Report failures
        if: always()
        run: python -m collect.report_failures
